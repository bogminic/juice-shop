<div id="code-area">
  <pre id="code"><div id="emphasize"><div @for (marker of lineMarkers; track marker) { class="lineMarker" [id]="'line' + marker.lineNumber" (click)="selectLines(marker.lineNumber)">{{ marker.marked ? '✅' : '🔲'}}</div>
  </div><code
    [highlight]="code" [lineNumbers]="true"
    [languages]="langs"
    ></code></pre>
</div>
